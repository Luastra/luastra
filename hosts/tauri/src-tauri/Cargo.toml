[package]
name = "luastra-phase5-desktop-host"
version = "0.2.0-alpha"
description = "Phase 5-owned Luastra Tauri desktop host"
authors = ["Viacheslav Beliaev"]
license = "Apache-2.0"
edition = "2021"
rust-version = "1.77.2"
publish = false

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
tauri = { version = "=2.11.5", features = [] }

[dev-dependencies]
glib = { path = "../../../third_party/rust/glib-0.18.5" }

# Tauri 2 currently requires gtk-rs 0.18 on Linux. This local copy carries the
# exact upstream fix for RUSTSEC-2024-0429 without changing the GTK ABI.
[patch.crates-io]
glib = { path = "../../../third_party/rust/glib-0.18.5" }
