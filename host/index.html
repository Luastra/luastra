<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f4efe3" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval' 'unsafe-eval'; style-src 'self'; connect-src 'self'; img-src 'self' data:; media-src 'self' blob:; font-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'" />
    <link rel="icon" href="./brand/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="./platform/phase5-ui.css" />
    <title>Luastra Preview</title>
  </head>
  <body>
    <div class="luastra-host">
      <header class="luastra-host-brand" aria-label="Luastra development host">
        <img src="./brand/luastra-mark.svg" alt="" />
        <span>Luastra</span>
        <span id="status" role="status" aria-live="polite">Starting…</span>
      </header>
      <pre id="error" hidden></pre>
      <div id="host-root"></div>
    </div>
    <script src="./bootstrap-errors.js"></script>
    <script type="module" src="./main.js"></script>
  </body>
</html>
