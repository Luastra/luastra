name: Public alpha quality

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-alpha-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: public-alpha-quality
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out admitted sources
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Select supported Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24"

      - name: Select the exact clean candidate
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          $materializer = "release/materialize-public-candidate.mjs"
          if (Test-Path $materializer) {
            $candidate = Join-Path $env:RUNNER_TEMP "luastra-clean-candidate"
            node $materializer --output $candidate
          } elseif (Test-Path "CLEAN_EXPORT_MANIFEST.json") {
            $candidate = (Get-Location).Path
          } else {
            throw "neither the private materializer nor a clean candidate manifest is present"
          }
          "CANDIDATE=$candidate" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Verify source, documentation, examples, and website
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          Set-Location "$env:CANDIDATE"
          npm ci
          npm run alpha:audit
          npm test
          npm run docs:check
          npm --prefix website run reference:build
          npm run alpha:audit

